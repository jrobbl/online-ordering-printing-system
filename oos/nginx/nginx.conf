upstream backend_api {
    server backend:3000;
}

server {
    listen 80;
    server_name jrobbl.com www.jrobbl.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name jrobbl.com www.jrobbl.com;

    ssl_certificate     /etc/letsencrypt/live/jrobbl.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jrobbl.com/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location = /admin {
        return 301 $scheme://$http_host/admin/;
    }

    location /admin/ {
        rewrite ^/admin/$ /admin/index.html break;
        rewrite ^/admin/(.+)$ /admin/$1 break;

        location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    location / {
        rewrite ^/$ /customer/index.html break;
        rewrite ^/(.+)$ /customer/$1 break;

        location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
            rewrite ^/(.+)$ /customer/$1 break;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
